<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Get in touch — maths tutoring and gym coaching in Stanmore. WhatsApp, email, or fill out the form.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://aryoluke.github.io/tutor/contact/">
<title>Contact — Aryan Tutors</title>
<style>:root{--bg:#fafaf8;--text:#1a1a1a;--muted:#666;--accent:#2d6a4f;--card:#fff;--border:#e8e8e4;--shadow:0 1px 3px rgba(0,0,0,.06)}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}.container{max-width:760px;margin:0 auto;padding:0 24px}nav{padding:16px 0;display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:40px}nav a{color:var(--muted);text-decoration:none;font-sizd:.9rem;font-weight:500}nav a:hover,nav a.active{color:var(--text)}nav a.active{border-bottom:2px solid var(--accent);padding-bottom:2px}header{padding:20px 0 40px}header h1{font-size:2.2rem;font-weight:700;letter-spacing:-0.5px}header .sub{color:var(--muted);font-size:1rem;margin-top:4px}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:50px}.contact-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:all .2s;display:block;text-align:center}.contact-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}.contact-card .icon{font-size:2.2rem;margin-bottom:12px}.contact-card h3{font-size:1.1rem;font-weight:600;margin-bottom:4px}.contact-card p{font-size:.88rem;color:var(--muted);line-height:1.5}.form-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:var(--shadow);margin-bottom:40px}.form-section h2{font-size:1.3rem;font-weight:600;margin-bottom:20px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:.9rem;font-weight:500;margin-bottom:6px}.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;font-family:inherit;background:var(--bg);transition:border-color .2s}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}.form-group textarea{resize:vertical;min-height:100px}.btn{display:inline-block;padding:14px 32px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}.btn:hover{opacity:.9;transform:translateY(-1px)}footer{text-align:center;padding:32px 0;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border)}@media(max-width:600px){.contact-grid{grid-template-columns:1fr}.container{padding:0 16px}header h1{font-size:1.8rem}.form-section{padding:20px}}</style>
</head>
<body>
<div class="container">
<nav>
  <a href="../">Home</a>
  <a href="../maths/">Maths</a>
  <a href="../gym/">Gym</a>
  <a href="../pricing/">Pricing</a>
  <a href="../about/">About</a>
  <a href="../reviews/">Reviews</a>
  <a href="../contact/" class="active">Contact</a>
</nav>
<header>
  <h1>Get in touch</h1>
  <div class="sub">The easiest way is WhatsApp — but any method works.</div>
</header>

<div class="contact-grid">
  <a href="https://wa.me/447777940152" class="contact-card">
    <div class="icon">💼</div>
    <h3>WhatsApp</h3>
    <p>Fastest response. Send a message any time.</p>
  </a>
  <a href="mailto:aryoluke29@gmail.com" class="contact-card">
    <div class="icon">📇</div>
    <h3>Email</h3>
    <p>aryoluke29@gmail.com — I'll reply within 24 hours.</p>
  </a>
</div>

<div class="form-section">
  <h2>Or drop a message here</h2>
  <form action="https://formspree.io/f/your-form-id" method="POST">
    <div class="form-group">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="What should I call you?" required>
    </div>
    <div class="form-group">
      <label for="contact">Email or phone</label>
      <input type="text" id="contact" name="contact" placeholder="How can I reach you?" required>
    </div>
    <div class="form-group">
      <label for="subject">What are you interested in?</label>
      <select id="subject" name="subject">
        <option value="">Select...</option>
        <option value="maths">Maths tutoring</option>
        <option value="gym">Gym coaching</option>
        <option value="both">Both</option>
        <option value="other">Something else</option>
      </select>
    </div>
    <div class="form-group">
      <label for="message">Tell me a bit about what you're looking for</label>
      <textarea id="message" name="message" placeholder="e.g. year group, current level, goals, availability..."></textarea>
    </div>
    <button type="submit" class="btn">Send message</button>
  </form>
</div>

<footer>
  <p>© 2026 Aryan Mehta . <a href="mailto:aryoluke29@gmail.com" style="color:inherit">aryoluke29@gmail.com</a></p>
</footer>
</div>
</body>
</html>
