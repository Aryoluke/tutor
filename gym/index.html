<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Gym coaching in Stanmore — calisthenics skills, beginners fitness, home workouts, posture correction, and diet guidance.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://aryoluke.github.io/tutor/gym/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewbox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e65100'/><text x='50' y='68' text-anchor='middle' font-size='50' font-weight='700' font-family='system-ui' fill='%23fff'>AT</text></svg>">
<title>Gym Coaching – Aryan Tutors</title>
<style>
:root{--bg:#121212;--bg2:#1e1e1e;--text:#f0f0f0;--muted:#aaa;--accent:#e65100;--accent2:#ff8f00;--card:#1a1a1a;--border:#2a2a2a;--light:#222}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.nav-bar{position:sticky;top:0;z-index:100;background:rgba(18,18,18,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:1.2rem;color:var(--text)}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;font-weight:800}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500}
.nav-links a:hover,.nav-links a.active{color:var(--text)}
.nav-links a.active{border-bottom:2px solid var(--accent);padding-bottom:2px}
.nav-cta{background:var(--accent);color:#fff!important;padding:8px 18px;border-radius:8px;font-weight:600!important}
.hero{padding:70px 32px 50px;max-width:900px;margin:0 auto;text-align:center}
.hero .section-label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:12px}
.hero h1{font-size:3rem;font-weight:800;letter-spacing:-1.5px;margin-bottom:16px}
.hero p{font-size:1.15rem;color:var(--muted);max-width:560px;margin:0 auto;line-height:1.7}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease-out,transform .6s ease-out}
.reveal.visible{opacity:1;transform:translateY(0)}
section{padding:60px 32px}
section.alt{background:var(--light)}
.section-inner{max-width:900px;margin:0 auto}
.section-inner .section-label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:12px}
.section-heading{font-size:2rem;font-weight:700;letter-spacing:-0.6px;margin-bottom:12px}
.section-sub{font-size:1.05rem;color:var(--muted);line-height:1.7;margin-bottom:24px}
.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.service-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;transition:all .3s ease}
.service-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.3)}
.service-card h3{font-size:1.15rem;font-weight:700;margin-bottom:8px;color:var(--accent)}
.service-card p{font-size:.92rem;color:var(--muted);line-height:1.6;margin-bottom:0;max-width:none}
.btn{display:inline-block;padding:14px 32px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;background:var(--accent);color:#fff;transition:all .2s}
.btn:hover{background:var(--accent2);transform:translateY(-2px)}
.cta-section{text-align:center;padding:60px 32px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.cta-section h2{font-size:2rem;font-weight:700;margin-bottom:12px}
.cta-section p{opacity:.9;margin-bottom:24px;font-size:1.05rem}
.cta-section .btn{background:#fff;color:var(--accent)}
.cta-section .btn:hover{box-shadow:0 6px 20px rgba(0,0,0,.3)}
#bdt{position:fixed;bottom:24px;right:24px;width:44px;height:44px;background:var(--accent);color:#fff;border:none;border-radius:50%;font-size:1.2rem;cursor:pointer;opacity:0;pointer-events:none;transition:all .3s;z-index:200;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3}
#btt.visible{opacity:1;pointer-events:auto}
footer{padding:32px 32px;border-top:1px solid var(--border);text-align:center}
footer p{color:var(--muted);font-size:.85rem}
footer a{color:inherit}
@media(max-width:768px){.nav-links{display:none}.hero h1{font-size:2rem}.service-grid{grid-template-columns:1fr}.section-heading{font-size:1.6rem}section{padding:50px 20px}}
.reveal{opacity:1!important;transform:none!important}
</style>
