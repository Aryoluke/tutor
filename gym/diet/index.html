<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet & Nutrition - Tutor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: #0d0d0d; color: #e8e8e8; line-height: 1.6; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .hero { padding: 100px 0 80px; text-align: center; background: linear-gradient(180deg, #0d0d0d 0%, #1a0f0a 100%); }
        .hero-label { display: inline-block; background: rgba(255,107,0,0.15); color: #ff6b00; font-size: 0.75rem; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; padding: 6px 16px; border-radius: 100px; margin-bottom: 24px; }
        .hero h1 { font-size: 3rem; font-weight: 800; color: #fff; max-width: 700px; margin: 0 auto 20px; line-height: 1.2; }
        .hero p { font-size: 1.15rem; color: #999; max-width: 600px; margin: 0 auto; }
        .hero p strong { color: #ff6b00; }
        .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        @media (max-width: 768px) { .hero { padding: 80px 0 60px; } .hero h1 { font-size: 2.2rem; } .hero p { font-size: 1rem; } }
        .section { padding: 80px 0; }

        .section-title span { color: #ff6b00; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 28px 24px; transition: border-color 0.3s, transform 0.3s; }
        .card:hover { border-color: #ff6b00; transform: translateY(-4px); }
        .card-icon { font-size: 1.8rem; margin-bottom: 16px; }
        .card h3 { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 10px; }

        .card li { font-size: 0.9rem; color: #aaa; padding: 4px 0; position: relative; padding-left: 16px; }
        .card li::before { content: "\25B6"; color: #ff6b00; position: absolute; left: 0; }
        .tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .tip-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 28px 24px; display: flex; gap: 16px; align-items: flex-start; transition: border-color 0.3s; }
        .tip-card:hover { border-color: #ff6b00; }
        .tip-num { background: rgba(255,107,0,0.12); color: #ff6b00; font-size: 1.1rem; font-weight: 800; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .tip-card h4 { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .tip-card p { font-size: 0.9rem; color: #999; }
        .testimonial { background: linear-gradient(135deg, #1a0f0a 0%, #1a1a1a 100%); border: 1px solid #2a2a2a; border-radius: 20px; padding: 48px 40px; text-align: center; max-width: 750px; margin: 0 auto; }
        .testimonial .quote { font-size: 2rem; color: #ff6b00; margin-bottom: 16px; line-height: 1; }
        .testimonial blockquote { font-size: 1.2rem; color: #ddd; font-style: italic; line-height: 1.7; margin-bottom: 20px; }
        .testimonial blockquote strong { color: #ff6b00; font-style: normal; }
        .testimonial .author { font-weight: 700; color: #fff; font-size: 0.95rem; }
        .testimonial .role { color: #777; font-size: 0.85rem; }
        .cta-section { padding: 80px 0; text-align: center; }
        .cta-box { background: linear-gradient(135deg, #ff6b00, #ff4500); border-radius: 20px; padding: 64px 40px; color: #fff; }
        .cta-box h2 { font-size: 2rem; font-weight: 800; margin-bottom: 16px; }
        .cta-box p { font-size: 1.05rem; opacity: 0.9; margin-bottom: 32px; }
        .cta-btn { display: inline-block; background: #fff; color: #ff6b00; font-weight: 700; padding: 14px 36px; border-radius: 100px; font-size: 1rem; transition: transform 0.3s, box-shadow 0.3s; }
        .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        footer { border-top: 1px solid #2a2a2a; padding: 32px 0; text-align: center; color: #555; font-size: 0.85rem; }
        footer a { color: #ff6b00; }
        .section-label { display: inline-block; background: rgba(255,107,0,0.15); color: #ff6b00; font-size: 0.75rem; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; padding: 6px 16px; border-radius: 100px; margin-bottom: 16px; }
        .section-heading { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 12px; }
        .section-sub { font-size: 1.05rem; color: #999; max-width: 650px; margin-bottom: 40px; }
        .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .service-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 28px 24px; transition: border-color 0.3s; }
        .service-card:hover { border-color: #ff6b00; }
        .service-card h3 { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .service-card p { font-size: 0.9rem; color: #999; line-height: 1.6; }
        @media (max-width: 600px) { .section { padding: 60px 0; } .section-title { font-size: 1.6rem; margin-bottom: 32px; } .testimonial { padding: 32px 24px; } .cta-box { padding: 48px 24px; } .cta-box h2 { font-size: 1.5rem; } .tip-card { flex-direction: column; } }
.reveal{opacity:1!important;transform:none!important}
    </style>
</head>
