<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skills Training – Aryan Tutors</title>
  <style>
    :root{--bg:#121212;--surface:#1e1e1e;--text:#e8e8e8;--muted:#999;--accent:#e65100;--accent2:#ff8f00;--border:#2a2a2a;--light:#1a1a1a}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
    .nav-bar{position:sticky;top:0;z-index:100;background:rgba(18,18,18,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .nav-inner{max-width:1100px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:1.2rem;color:var(--text);letter-spacing:-0.3px}
    .logo-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;font-weight:800}
    .nav-links{display:flex;gap:24px;align-items:center}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;transition:color .15s}
    .nav-links a:hover,.nav-links a.active{color:var(--text)}
    .nav-links a.active{border-bottom:2px solid var(--accent);padding-bottom:2px}
    .nav-cta{background:var(--accent);color:#fff!important;padding:8px 18px;border-radius:8px;font-weight:600!important}
    .hero{padding:80px 32px 60px;max-width:900px;margin:0 auto;text-align:center}
    .hero .section-label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent2);margin-bottom:12px}
    .hero h1{font-size:3rem;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px}
    .hero p{font-size:1.15rem;color:var(--muted);max-width:620px;margin:0 auto;line-height:1.7}
    section{padding:70px 32px}
    section.alt{background:var(--light)}
    .section-inner{max-width:900px;margin:0 auto}
    .section-label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--accent2);margin-bottom:12px}
    .section-heading{font-size:2rem;font-weight:700;letter-spacing:-0.6px;line-height:1.2;margin-bottom:12px}
    .section-sub{font-size:1.05rem;color:var(--muted);line-height:1.7;margin-bottom:36px;max-width:620px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .card .icon{font-size:2rem;margin-bottom:12px}
    .card h3{font-size:1.15rem;font-weight:700;margin-bottom:6px;color:#fff}
    .card .level{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:600;margin-bottom:10px;background:var(--accent);color:#fff}
    .card p{font-size:.9rem;color:var(--muted);line-height:1.5;margin-bottom:10px}
    .card ul{list-style:none}
    .card ul li{font-size:.85rem;color:#aaa;padding:3px 0}
    .card ul li::before{content:"✦ ";color:var(--accent2)}
    .prereq-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .prereq-card{background:var(--surface);border:1px solid #3d2e1a;border-radius:14px;padding:22px 24px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .prereq-card h3{font-size:.95rem;font-weight:600;color:var(--accent2);margin-bottom:8px;line-height:1.4}
    .prereq-card p{font-size:.87rem;color:var(--muted);line-height:1.6}
    .approach-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.3);border-left:3px solid var(--accent2)}
    .approach-card h3{font-size:1rem;font-weight:700;margin-bottom:8px;color:#fff}
    .approach-card p{font-size:.88rem;color:var(--muted);line-height:1.6}
    .testimonial{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;text-align:center;max-width:700px;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.3);position:relative}
    .testimonial::before{content:"\201C";font-size:4rem;color:var(--accent2);position:absolute;top:8px;left:24px;line-height:1;font-family:Georgia,serif;opacity:.5}
    .testimonial p{font-size:1rem;color:#ccc;font-style:italic;line-height:1.8;margin-bottom:12px}
    .testimonial .name{font-size:.85rem;color:var(--muted);font-weight:500}
    .cta-section{background:linear-gradient(135deg,var(--accent),#bf360c);color:#fff;text-align:center;padding:70px 32px}
    .cta-section h2{font-size:2rem;font-weight:700;letter-spacing:-0.6px;margin-bottom:12px}
    .cta-section p{font-size:1.05rem;opacity:.9;margin-bottom:28px}
    .btn{display:inline-block;padding:14px 30px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;transition:all .2s}
    .btn-primary{background:#fff;color:var(--accent)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
    footer{padding:40px 32px;border-top:1px solid var(--border);text-align:center}
    footer p{color:var(--muted);font-size:.85rem}
    footer a{color:inherit}
    .reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}
    @media(max-width:768px){.nav-links{display:none}.hero h1{font-size:2rem}.grid-2,.prereq-grid{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr 1fr}section{padding:50px 20px}.section-heading{font-size:1.6rem}}
    @media(max-width:480px){.grid-4{grid-template-columns:1fr}}
    .reveal{opacity:1!important;transform:none!important}
  </style>
</head>
