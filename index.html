<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryan Tutors — Maths & Gym Coaching</title>
    <meta name="description" content="Aryan Tutors offers expert Maths tutoring (KS3 to A-Level) and Gym coaching (Calisthenics & Strength) by Aryan Mehta.">
    <meta name="keywords" content="maths tutor, gym coach, ks3 maths, gcse maths, a-level maths, calisthenics, strength training, aryan mehta">
    <meta property="og:title" content="Aryan Tutors — Maths & Gym Coaching">
    <meta property="og:description" content="Expert Maths tutoring and Gym coaching by Aryan Mehta.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aryoluke.github.io/tutor/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }
        .shape:nth-child(1) {
            width: 400px; height: 400px;
            background: #e94560;
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .shape:nth-child(2) {
            width: 300px; height: 300px;
            background: #0f3460;
            bottom: -80px; right: -80px;
            animation-delay: -5s;
        }
        .shape:nth-child(3) {
            width: 200px; height: 200px;
            background: #533483;
            top: 50%; left: 50%;
            animation-delay: -10s;
        }
        .shape:nth-child(4) {
            width: 150px; height: 150px;
            background: #e94560;
            bottom: 20%; right: 10%;
            animation-delay: -15s;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            border-radius: 0;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -40px) rotate(90deg); }
            50% { transform: translate(-20px, 20px) rotate(180deg); }
            75% { transform: translate(40px, 30px) rotate(270deg); }
        }
        .container {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 3rem;
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .card .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }
        .card p {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn:hover {
            background: rgba(255,255,255,0.25);
        }
        footer {
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
        }
        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>

    <div class="container">
        <h1>Aryan Tutors</h1>
        <p class="subtitle">Maths &amp; Gym Coaching</p>

        <div class="cards">
            <div class="card">
                <div class="icon">🧮</div>
                <h2>Maths Tutoring</h2>
                <p>KS3 to A-Level</p>
                <a href="/tutor/maths" class="btn">Learn More</a>
            </div>
            <div class="card">
                <div class="icon">💪</div>
                <h2>Gym Coaching</h2>
                <p>Calisthenics &amp; Strength</p>
                <a href="/tutor/gym" class="btn">Learn More</a>
            </div>
        </div>

        <footer>&copy; 2026 Aryan Mehta</footer>
    </div>
</body>
</html>
